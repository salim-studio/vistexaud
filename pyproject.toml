[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vistexaud"
version = "0.1.0"
description = "Fast, practical, unified Vision/Text/Audio pipeline framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "salim-slimani" }]
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
full = ["onnxruntime>=1.16"]

[project.scripts]
vistexaud = "vistexaud.cli:main"

[tool.setuptools.packages.find]
include = ["vistexaud*"]
